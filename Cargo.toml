[package]
name = "hnoss"
version = "0.1.0"
edition = "2024"
description = "Exact monetary values for Rust, with zero dependencies"
license = "MIT OR Apache-2.0"
repository = "https://github.com/thomas666-beast/hnoss"
readme = "README.md"
keywords = ["money", "currency", "iso4217", "finance", "decimal"]
categories = ["finance", "value-formatting"]

[dependencies]
# Intentionally empty. This crate has no runtime dependencies.

[dev-dependencies]
# Intentionally empty. Tests use only `std`.

[lib]
name = "hnoss"
path = "src/lib.rs"

[profile.release]
lto = true
codegen-units = 1
